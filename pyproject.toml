[project]
name = "anduin"
version = "0.1.0"
description = "GTFS transit data processing and map matching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyvalhalla>=3.6.2",
    "osmium>=3.7.0",
]

[project.scripts]
anduin = "anduin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.6.2",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
